name: API

on:
  push:
    branches: [master]
    paths: ["api/**"]
  pull_request:
    branches: [master]
    paths: ["api/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: api/.python-version
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
